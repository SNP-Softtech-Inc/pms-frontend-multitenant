name: Deploy Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

env:
  DEPLOY_PATH: /var/www/pmsAdmin-staging/build
  BUILD_DIR: build

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - run: npm ci

      - run: npm run build
        env:
          NODE_ENV: production

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes" \
            ./$BUILD_DIR/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/