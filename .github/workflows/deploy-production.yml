# .github/workflows/deploy-production.yml
# main branch -> production server

name: Deploy Production

on:
  push:
    branches: [main, release/*]
  workflow_dispatch:

env:
  # [FILL] Nginx root path on the PRODUCTION server (the `root` in your server block)
  DEPLOY_PATH: /var/www/pmsAdmin
  # [FLAG] CRA outputs "build", Vite outputs "dist"
  BUILD_DIR: build

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'   # [FLAG] guessed
          cache: 'npm'

      - run: npm ci             # [FLAG] needs package-lock.json committed

      - run: npm run build
        env:
          NODE_ENV: production
          # [FILL] build-time vars for production, e.g.
          # VITE_API_URL: ${{ vars.API_URL }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes" \
            ./$BUILD_DIR/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/