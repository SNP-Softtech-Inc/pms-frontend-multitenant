# .github/workflows/deploy-production.yml
# main branch -> production server

name: Deploy Production

on:
  push:
    branches: [main, release/*]
  workflow_dispatch:

concurrency:
  group: deploy-production

env:
  DEPLOY_PATH: /var/www/pmsAdmin
  BUILD_DIR: build

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Create .env from production variables
        env:
          ENV_PRODUCTION: ${{ vars.ENV_PRODUCTION }}
        run: |
          rm -f .env
          printf '%s\n' "$ENV_PRODUCTION" > .env

      - run: npm ci

      - run: npm run build
        env:
          NODE_ENV: production

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Upload build to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectionAttempts=3" \
            ./$BUILD_DIR/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/build/

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy